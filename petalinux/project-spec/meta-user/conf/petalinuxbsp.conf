#User Configuration

#OE_TERMINAL = "tmux"

# The host's Git HTTP/2 connections to upstream Git servers fail; HTTP/1.1
# succeeds. Keep this setting scoped to this PetaLinux project's BitBake fetcher.
FETCHCMD_git = "git -c http.version=HTTP/1.1 -c gc.autoDetach=false -c core.pager=cat"

# plnx-deploy.bbclass defaults to ${TOPDIR}/images/linux, i.e. inside build/.
# petalinux-package and the SCAM scripts expect <project>/images/linux.
PLNX_DEPLOY_DIR = "${TOPDIR}/../images/linux"
IMAGE_BOOT_FILES:zynqmp = "BOOT.BIN boot.scr Image"
